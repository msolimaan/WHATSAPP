# Fly.io: run `fly launch --no-deploy --copy-config` and pick your own app name.
app = "whatsapp-mcp-change-me"
primary_region = "gru" # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  TIMEZONE = "America/Sao_Paulo"

# The SQLite database and its follow-up schedule live here.
[mounts]
  source = "whatsapp_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Must stay on: webhooks arrive at any time and follow-ups are sent on a schedule.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
